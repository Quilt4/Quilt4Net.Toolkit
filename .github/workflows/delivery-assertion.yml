# Asserts, from outside the release pipeline, that what consumers can install is what was merged.
#
# Issues #1 and #2. The point is stated in #1: a check inside the pipeline cannot detect the absence
# of the pipeline. A guard is a stage, a stage only evaluates inside a run, and the failure that
# started this was a merge that queued no run at all. A schedule fires whether or not CI triggered,
# which is the property that matters.
#
# The alert IS this workflow failing. There is no Slack, webhook or mail anywhere in either repo, and
# a red scheduled run is a channel that already exists and is already watched. Building a notifier
# would have been a larger job than the check.
name: Delivery assertion

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stalled-gate:
    name: The release that would publish master is not parked
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the newest master CI run is stuck awaiting approval
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_MINUTES: '60'
        run: |
          set -euo pipefail

          # Only the NEWEST master run matters, and only master runs matter at all.
          #
          # PR builds park at the `prerelease` gate and are deliberately never approved - only the
          # last one is ever published - so a parked PR run is normal here, not a fault. An earlier
          # cut of this check failed on them and found 27, which would have left it permanently red:
          # a check that is always red is ignored, which is the very blindness this exists to cure.
          #
          # Superseded master runs do not matter either, because a release publishes everything up to
          # it - so a later approved release already carried their commits. What is actionable is
          # exactly one thing: the release that would publish master as it stands is sitting unapproved.
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=master&per_page=1" \
                  --jq '.workflow_runs[0] | [.id, .status, .created_at, .html_url] | @tsv')

          if [ -z "$run" ]; then
            echo "No master CI run found."
            exit 0
          fi

          IFS=$'\t' read -r id status created url <<< "$run"
          minutes=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 60 ))
          echo "newest master CI run: $id status=$status age=${minutes}m"

          if [ "$status" != "waiting" ]; then
            echo "Not parked."
            exit 0
          fi

          if [ "$minutes" -le "$THRESHOLD_MINUTES" ]; then
            echo "Parked for ${minutes}m - under threshold, the approval may still be coming."
            exit 0
          fi

          echo "::error::The newest master CI run has been awaiting approval for ${minutes}m, so nothing has published master. $url"
          exit 1

  every-master-push-has-a-run:
    name: Every push to master produced a run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a master push has no CI run
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_DAYS: '14'
          # A push seconds old may legitimately have no run recorded yet.
          SETTLE_MINUTES: '10'
        run: |
          set -euo pipefail

          # This replaces an earlier check that compared master against the published package, which
          # was wrong: it asserted "nuget.org == master", and that is not an invariant of this system.
          # Releases are batched and features are held back deliberately, so master sitting ahead is
          # a decision, not a defect - and a check that fails on a correct state is noise, which is
          # the blindness this whole workflow exists to cure.
          #
          # What the pipeline actually promises is narrower and real: every push to master gets a run.
          # That holds whether or not anyone approves the release, so it has no false positive on a
          # deliberate hold - and it is exactly the 2026-08-26 failure, a merge that queued no run at
          # all with the trigger intact.
          #
          # First-parent only: a merge brings in branch commits that never were master's HEAD and
          # never get their own master run. Checking every reachable commit would report those as
          # missing, which is how an approximately-right assertion becomes noise.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=master&per_page=100" \
            --jq '.workflow_runs[].head_sha' | sort -u > runs.txt

          missing=0
          now=$(date -u +%s)

          for sha in $(git rev-list --first-parent origin/master --since="${WINDOW_DAYS} days ago"); do
            committed=$(git show -s --format=%ct "$sha")
            minutes=$(( (now - committed) / 60 ))
            [ "$minutes" -lt "$SETTLE_MINUTES" ] && continue

            if ! grep -q "^${sha}$" runs.txt; then
              subject=$(git show -s --format=%s "$sha")
              echo "::error::No CI run for master commit ${sha:0:8} (${minutes}m old): $subject"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "Every master push in the last ${WINDOW_DAYS}d has a run."
          fi

          exit "$missing"
